events {
    worker_connections 1024;
}

http {
    upstream ai-agent-platform {
        server ai-agent-platform:8000;
    }

    server {
        listen 80;
        server_name localhost;

        # Increase client max body size for large requests
        client_max_body_size 10M;

        # Main application
        location / {
            proxy_pass http://ai-agent-platform;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # WebSocket support
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # Health check endpoint
        location /health {
            proxy_pass http://ai-agent-platform/health;
            access_log off;
        }

        # Static files for dashboard
        location /static/ {
            proxy_pass http://ai-agent-platform/static/;
            expires 1d;
            add_header Cache-Control "public, immutable";
        }
    }
}